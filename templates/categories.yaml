# 기본 카테고리 트리. 뱅크샐러드 자동분류 대분류를 그대로 쓰고, 부족한 것만 늘린다.
# (뱅샐이 이미 70% 안팎을 맞춰 두므로 '미분류'와 '이체'만 우리가 채우면 된다.)
# 사람마다 세부(sub)는 자유. 대분류는 가급적 이 목록 안에서 골라야 AI 재무 도우미 쪽 비교가 된다.
expense:
  식사: [외식, 배달, 점심, 가족외식, 식재료]
  카페/간식: [카페, 편의점, 디저트]
  생활: [온라인장보기, 생활용품, 세탁, 반려동물]
  주거/통신: [월세, 관리비, 공과금, 통신비, 인터넷]
  교통: [대중교통, 택시, 하이패스]
  자동차: [주유, 정비, 보험, 할부]
  의료/건강: [병원, 약국, 아이병원, 건강검진, 운동]
  의복/미용: [옷, 화장품, 미용실]
  문화/여가: [영화, 공연, 취미, 게임]
  여행/숙박: [숙박, 항공, 여행경비]
  교육: [학원, 도서, 강의]
  육아: [보육료, 아이용품, 아이옷, 아이교육]
  경조사: [축의, 조의, 선물]
  구독: [OTT, 소프트웨어, 멤버십]
  보험: [실손, 종신, 자동차, 저축성]
  가족: [부모님 용돈, 생활비 이전, 자녀 용돈]
  세금/수수료: [세금, 수수료, 이자]
  사업: [사업지출]           # options.business_split=true 일 때만
  기타: [기타]
income:
  수입: [급여, 사업소득, 프리랜서, 배당, 이자, 가족 지원, 환급, 기타수입]
transfer:
  내부이체: [계좌간이동, 카드대금, 저축·투자 이체]
  자산거래: [부동산 매입·매도, 보증금 납입·반환, 대출 실행·상환, 증권계좌 입출금]   # 현금흐름 밖. 큰 이체는 대부분 이것

# 고정비로 볼 카테고리/세부 (recurring 매칭이 없어도 이 세부면 고정비 Y)
fixed_subs: [월세, 관리비, 공과금, 통신비, 인터넷, 보육료, 학원, OTT, 소프트웨어, 멤버십, 실손, 종신, 자동차, 저축성, 할부]
