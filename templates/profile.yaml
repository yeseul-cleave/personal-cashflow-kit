# ============================================================
#  내 재무 프로필 (private/profile.yaml)
#  사람마다 다른 것은 전부 이 파일에만 들어간다. 스크립트는 공통.
#  → scripts/inspect_export.py 가 export를 읽고 이 파일의 초안을 만들어 준다.
#  → 그 초안을 AI와 인터뷰하며 채운다. 빈 항목은 지워도 된다.
# ============================================================
version: 1

household:
  label: "우리집"            # 아무 이름. 싱글이면 내 이름.
  members:
    - id: me                 # 고정. 이 export의 주인.
      label: "나"
      role: self
    # 가족이 없으면 아래는 지운다. 있으면 필요한 만큼 추가.
    - id: spouse
      label: "배우자"
      role: spouse           # spouse | child | parent | sibling | other
      shared_household: true # 같은 가계로 볼 것인가 (생활비를 합쳐 계산)
    - id: mom
      label: "엄마"
      role: parent
      shared_household: false  # 같은 가계가 아님 → 이 사람과의 돈 이동은 '가족 간 이전'으로 집계

# ------------------------------------------------------------
# 계좌·카드·투자·대출: export의 "결제수단"/"상품명" 글자와 똑같이 적는다.
#   kind : checking(입출금) savings(저축·청약) card pay(간편결제·머니)
#          investment pension loan insurance cash
#   owner: members.id 중 하나
#   role : living   생활비가 오가는 계좌 (수입·지출 집계에 포함)
#          saving   저축·투자 목적 (여기로 가는 이체 = '저축·투자 이체')
#          business 사업용 (options.business_split=true 면 따로 집계)
#          custodial 남의 돈을 내 이름으로 보관 (custody 필수)
#          exclude  집계에서 완전히 제외 (부모님 카드, 이미 해지된 계좌 등)
#   custody: {of: <member id>, share: 0.4}  또는 {of: mom, amount: 30000000}
#            → 자산 평가에서 그 비율/금액은 내 순자산에서 빼고 '위탁 자산'으로 따로 보여준다
#   aliases: 이체 내용에 이 계좌를 가리키는 표현 (내부이체 감지용) 예: ["토뱅", "토스"]
# ------------------------------------------------------------
accounts:
  - name: "토스뱅크 통장"
    kind: checking
    owner: me
    role: living
    aliases: ["토뱅"]
  - name: "네이버 현대카드"
    kind: card
    owner: me
    role: living
  - name: "키움증권 위탁계좌"
    kind: investment
    owner: me
    role: custodial
    custody: {of: mom, share: 0.5}   # 절반은 엄마 돈
  - name: "OO카드 스카이패스"
    kind: card
    owner: mom
    role: exclude                    # 엄마 카드가 내 이름으로 연결돼 있는 경우

# ------------------------------------------------------------
# 이체 판정 보조
# ------------------------------------------------------------
transfers:
  # 이체 '내용'에 이 단어가 있으면 내 계좌끼리의 이동으로 본다 (보통 본인 이름)
  internal_keywords: ["홍길동"]
  # 가족 간 이전: 상대 이름이 내용에 나오면 수입/지출로 집계
  family:
    - {match: "엄마", member: mom, category: "가족", sub: "부모님 용돈"}
    - {match: "김배우", member: spouse, category: "가족", sub: "생활비 이전"}

# ------------------------------------------------------------
# 고정비 계약 (매달 나가는 것). match 는 내용 부분 포함.
# ------------------------------------------------------------
recurring:
  - {match: "관리비", category: "주거/통신", sub: "관리비"}
  - {match: "월세", category: "주거/통신", sub: "월세"}
  - {match: "넷플릭스", category: "구독", sub: "OTT"}
  - {match: "현대해상", category: "보험", sub: "실손"}
  - {match: "어린이집", category: "육아", sub: "보육료"}

# ------------------------------------------------------------
# 수입원 정의
# ------------------------------------------------------------
income:
  - {match: "급여", category: "수입", sub: "급여"}
  - {match: "배당", category: "수입", sub: "배당"}
  - {match: "엄마", category: "수입", sub: "가족 지원"}

# ------------------------------------------------------------
# 뱅크샐러드에 안 잡히는 자산·부채는 여기에 직접 (부동산, 비상장주식, 전세보증금, 빌려준 돈, 사적 채무)
#   kind: realestate | unlisted | deposit | receivable | other  /  부채는 kind 자유
# ------------------------------------------------------------
manual_assets:
  - {name: "OO아파트", kind: realestate, owner: me, value: 800000000, note: "KB시세 2026-09"}
  - {name: "비상장 A사", kind: unlisted, owner: me, value: 30000000, note: "장외가 기준"}
manual_liabilities:
  - {name: "부모님께 빌린 돈", kind: 사적채무, value: 20000000}

options:
  business_split: false   # 사업 계좌가 있으면 true
  # --- 투자 여력 계산 가정 (financial_profile.md 맨 위 섹션). 모르면 그대로 둔다.
  baseline_months: 3      # 투자 여력·월평균은 최근 N개월 기준 (이사·목돈 달 왜곡 방지)
  emergency_months: 6     # 비상금으로 남겨둘 개월수 (월지출 × N). 프리랜서·자영업은 9~12
  retire_age: 60          # 은퇴 예정 나이 (나이는 뱅샐 현황 시트에서 읽음)
  return_rate: 0.04       # 연금·투자 연 기대수익률 (실질, 보수적)
  retire_spend_ratio: 0.7 # 은퇴 후 지출 = 지금 월지출 × 이 비율
  high_rate_debt: 0.05    # 이 금리 넘는 대출은 투자보다 상환 우선으로 표시
  # --- "집" 시나리오 (싱글 기본값). 관심 없으면 home_goal_price: 0
  home_goal_price: 500000000   # 목표 집값 (모르면 살고 싶은 동네 전용 59㎡ 시세 대략)
  home_ltv: 0.7                # 대출 비율 가정 → 필요한 내 돈 = 집값 × (1−LTV) + 취득세·비용 2%
  home_extra_cost: 0.02
  home_loan_rate: 0.04         # 주담대 금리 가정
  home_loan_years: 30
upcoming:                 # 6개월 안에 나갈 큰 돈 (있으면). 투자가용액에서 뺀다

# 투자·집 설계 인터뷰 답. AI가 한 번에 하나씩 묻고 답한 항목만 채운다.
investment_plan:
  home_direction: ""       # 현재 집 유지+대출 관리 / 갈아타기 / 추가 주택 / 금융자산 우선
  priority: ""             # 현금 안전판 / 집·대출 / 노후·연금 / 일반계좌 투자
  home_timing: ""          # 3년 이내 / 4~7년 / 8년 이후 / 계획 없음
  buyback_amount_basis: "" # 세후·비용후 실수령액 / 세금·비용 전 / 아직 계산 전
  contribution_funding: "" # 분담금 중 추가 대출과 현금의 재원 구분
  drawdown_capacity: ""    # 30% 하락에도 3년간 꺼내지 않을 수 있는 범위
  pension_constraint: ""   # 은퇴 전까지 묶어둘 수 있는 범위
  next_check: ""           # 다음 점검일 YYYY-MM-DD
  - {name: "전세 만기 추가 보증금", amount: 20000000, when: "2027-03"}
  lunch_max: 20000        # 이 금액 이하 식사는 '점심'으로 볼 때 (선택)
  small_transfer_ignore: 1000   # 이체 짝 매칭 허용 오차(원)
